# Gateway environment for the EWC JupyterHub VMs.
#
#   scp gateway-environment.yml ubuntu@<gateway-ip>:/tmp/
#   sudo install -m 0644 /tmp/gateway-environment.yml /opt/dask/environment.yml
#
# The shared scientific packages MUST stay byte-identical to the dependency list
# in cloud-init-dask-worker.yaml. Dask reports version skew between client,
# scheduler and worker as opaque deserialization errors, not as a clear message.
#
# Versions below were resolved against conda-forge, not guessed - python 3.12 is
# REQUIRED because zarr>=3.2 (needed by icechunk) has no 3.11 build.
name: dask
channels:
  - conda-forge
dependencies:
  - python=3.12
  - dask=2026.7.1
  - distributed=2026.7.1
  - numpy=2.5.1
  - pandas=3.0.3
  - xarray=2026.7.0
  - zarr=3.2.1
  - icechunk=2.1.1
  - netcdf4=1.7.4
  - h5netcdf=1.8.1
  - cfgrib=0.9.15.1
  - eccodes=2.48.0
  - fsspec=2026.6.0
  - s3fs=2026.6.0
  - psutil=7.2.2
  - bottleneck
  - lz4
  - blosc
  # --- gateway-only ---
  - jupyterhub=5.2.1
  - jupyterlab=4.2.5
  - notebook
  - configurable-http-proxy
  - jupyter-resource-usage
  - jupyter-server-proxy=4.4.0
  - matplotlib
  - cartopy
  - pip
  - pip:
      # Not on conda-forge; registers the "gribberish" Zarr v3 codec used by
      # GIK stores. Must match the workers.
      - gribberish>=1.4
      # 1.3.0+ required: JupyterHub 4.1 tightened XSRF validation, which breaks
      # 1.2.0 with "XSRF cookie does not match POST argument" on signup.
      - jupyterhub-nativeauthenticator==1.3.0
      - jupyterhub-systemdspawner==1.0.1
      - jupyterhub-idle-culler==1.4.0
      # httpx >=0.28 removed the "proxies" kwarg, breaking extensions that
      # still pass it (seen as a TypeError during spawn).
      - httpx<0.28
